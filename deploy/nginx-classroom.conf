# 把它放到 /etc/nginx/sites-available/classroom.conf，再 ln -s 到 sites-enabled
# 部署脚本 setup.sh 会自动把 __DOMAIN__ 替换成你的真实域名

# HTTP：用于 Let's Encrypt 验证，并强制跳转到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/classroom;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS：对外提供服务，并加一道访问密码，防止别人白嫖你的 AI key
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 基础访问密码（浏览器会弹窗输入）。文件由 setup.sh 用 htpasswd 生成
    auth_basic "课堂登录";
    auth_basic_user_file /etc/nginx/classroom.htpasswd;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
